<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Xadrez 3D Lindo e Fluido</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #08080a;
        background: radial-gradient(circle at center, #1a1a24 0%, #030305 100%);
        font-family: sans-serif;
        touch-action: none;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #d4af37;
        font-size: 1.2rem;
        letter-spacing: 2px;
        pointer-events: none;
        transition: opacity 0.5s ease;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="loading">MONTANDO O TABULEIRO...</div>
    <div id="canvas-container"></div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

      const SQUARE_SIZE = 2;
      const BOARD_OFFSET = (SQUARE_SIZE * 8) / 2 - SQUARE_SIZE / 2;

      const COLOR_ACCENT = 0xd4af37;

      let scene, camera, renderer, controls;
      let isUserInteracting = false;

      function init() {
        const container = document.getElementById("canvas-container");

        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050508, 0.012);

        camera = new THREE.PerspectiveCamera(
          40,
          window.innerWidth / window.innerHeight,
          0.1,
          1000,
        );
        camera.position.set(0, 24, 32);

        renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          powerPreference: "high-performance",
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(
          new RoomEnvironment(),
          0.02,
        ).texture;

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 8;
        controls.maxDistance = 50;

        controls.addEventListener("start", () => (isUserInteracting = true));

        setupLighting();
        createBoard();
        setupPieces();

        document.getElementById("loading").style.opacity = "0";
        window.addEventListener("resize", onWindowResize);
      }

      function setupLighting() {
        const ambientLight = new THREE.HemisphereLight(0xfff5e6, 0x050510, 0.3);
        scene.add(ambientLight);

        // 1. LUZ PRINCIPAL - Ajustada para baixo para criar sombras longas inter-peças
        const keyLight = new THREE.SpotLight(0xffeedd, 500);
        keyLight.position.set(35, 18, 10); // Ângulo dramático e mais baixo
        keyLight.angle = Math.PI / 4;
        keyLight.penumbra = 0.5;
        keyLight.decay = 1.3;
        keyLight.distance = 150;

        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 10;
        keyLight.shadow.camera.far = 80;

        // Bias super fino para permitir que sombras grudem no chão e em outras peças
        keyLight.shadow.bias = -0.0005;
        keyLight.shadow.normalBias = 0.005;
        keyLight.shadow.radius = 1.2; // Sombra mais dura e definida!
        scene.add(keyLight);

        // 2. LUZ DE PREENCHIMENTO - Sem projeção de sombras para não lavar as principais
        const fillLight = new THREE.SpotLight(0xaaccff, 150);
        fillLight.position.set(-20, 25, -20);
        fillLight.angle = Math.PI / 3;
        fillLight.penumbra = 0.8;
        fillLight.decay = 1.2;
        fillLight.distance = 150;
        fillLight.castShadow = false; // <-- CRUCIAL: Desligado para proteger as sombras projetadas
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffffff, 0.8);
        rimLight.position.set(0, 10, -30);
        scene.add(rimLight);
      }

      // --- GERADOR DE TEXTURAS DE MADEIRA: MACRO E MICRO PADRÕES ---
      // NOVA VERSÃO: Simula matematicamente os anéis de crescimento da árvore
      // para um visual de madeira real, com ranhuras amplas e definidas.
      function createWoodTexture(baseHex, veinHex, isKnotty = false) {
        const canvas = document.createElement("canvas");
        canvas.width = 1024;
        canvas.height = 1024;
        const ctx = canvas.getContext("2d");

        // Fundo da prancha
        ctx.fillStyle = baseHex;
        ctx.fillRect(0, 0, 1024, 1024);

        // Ponto central dos anéis (muito longe para veios esticados, dentro do ecrã para nós)
        const centerX = isKnotty ? 300 : -1500;
        const centerY = isKnotty ? 400 : 512;

        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        // Desenha os anéis concêntricos de crescimento
        for (let r = 10; r < 3500; r += Math.random() * 25 + 15) {
          ctx.beginPath();
          ctx.strokeStyle = veinHex;
          ctx.globalAlpha = Math.random() * 0.4 + 0.15; // Contraste alto para os veios
          ctx.lineWidth = Math.random() * 14 + 6; // Ranhuras largas e visíveis de longe

          for (let angle = -Math.PI / 2; angle < Math.PI * 1.5; angle += 0.05) {
            // Distorção para criar a imperfeição natural das fibras
            let noise = Math.sin(angle * 6) * 15 + Math.cos(angle * 4) * 20;

            if (isKnotty) {
              noise += Math.sin(angle * 12) * 10;
            } else {
              noise += Math.sin(r * 0.02 + angle * 3) * 50;
            }

            let x = centerX + Math.cos(angle) * (r + noise);
            // Alongamento drástico no eixo Y para esticar os veios (corte longitudinal)
            let y =
              centerY + Math.sin(angle) * (r + noise) * (isKnotty ? 1.5 : 4.0);

            if (angle === -Math.PI / 2) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }

        // Sombreamento natural nas bordas de cada casa (Burn/Vignette ligeiro)
        const grad = ctx.createRadialGradient(512, 512, 300, 512, 512, 800);
        grad.addColorStop(0, "rgba(255,255,255,0.02)");
        grad.addColorStop(1, "rgba(0,0,0,0.2)");
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 1024);

        const texture = new THREE.CanvasTexture(canvas);
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      function createBoard() {
        const boardGroup = new THREE.Group();

        // POOL DE MATERIAIS: Geramos várias texturas exclusivas para distribuir pelas casas
        const numVariations = 4;
        const lightMats = [];
        const darkMats = [];

        for (let i = 0; i < numVariations; i++) {
          // Cores ajustadas: A madeira escura agora é castanha para permitir ver o contraste das ranhuras
          const texLight = createWoodTexture("#e0b576", "#a36d26", false); // Pinho/Buxo Claro
          const texDark = createWoodTexture("#5c2e16", "#1a0b05", true); // Nogueira Escura com nós

          // O bumpScale casa agora com as linhas largas, criando sulcos físicos profundos e elegantes
          lightMats.push(
            new THREE.MeshPhysicalMaterial({
              map: texLight,
              bumpMap: texLight,
              bumpScale: 0.01,
              roughness: 0.4,
              metalness: 0.0,
              clearcoat: 0.2,
              clearcoatRoughness: 0.3,
            }),
          );

          darkMats.push(
            new THREE.MeshPhysicalMaterial({
              map: texDark,
              bumpMap: texDark,
              bumpScale: 0.01,
              roughness: 0.4,
              metalness: 0.0,
              clearcoat: 0.2,
              clearcoatRoughness: 0.3,
            }),
          );
        }

        const squareSizeVisual = SQUARE_SIZE - 0.04;
        const squareGeo = new RoundedBoxGeometry(
          squareSizeVisual,
          0.5,
          squareSizeVisual,
          6,
          0.06,
        );

        for (let x = 0; x < 8; x++) {
          for (let z = 0; z < 8; z++) {
            const isLight = (x + z) % 2 !== 0;
            // Escolhe uma variação de madeira aleatória do Pool
            const poolList = isLight ? lightMats : darkMats;
            const mat = poolList[Math.floor(Math.random() * poolList.length)];

            const square = new THREE.Mesh(squareGeo, mat);

            square.position.set(
              x * SQUARE_SIZE - BOARD_OFFSET,
              -0.25,
              z * SQUARE_SIZE - BOARD_OFFSET,
            );

            // CAOS ORGÂNICO: Rotação para a madeira não repetir.
            const baseRot = isLight ? 0 : Math.PI / 2;
            const flipRot = Math.floor(Math.random() * 2) * Math.PI;
            square.rotation.y = baseRot + flipRot;

            square.receiveShadow = true;
            square.castShadow = true;
            boardGroup.add(square);
          }
        }

        const groutGeo = new THREE.BoxGeometry(
          SQUARE_SIZE * 8 - 0.1,
          0.45,
          SQUARE_SIZE * 8 - 0.1,
        );
        const groutMat = new THREE.MeshStandardMaterial({
          color: 0x050505,
          roughness: 1.0,
        });
        const grout = new THREE.Mesh(groutGeo, groutMat);
        grout.position.set(0, -0.25, 0);
        boardGroup.add(grout);

        // Borda do tabuleiro ligeiramente mais escura que as casas pretas
        const texBorder = createWoodTexture("#361a0d", "#0a0402", true);
        const baseMat = new THREE.MeshPhysicalMaterial({
          map: texBorder,
          bumpMap: texBorder,
          bumpScale: 0.012,
          roughness: 0.5,
          metalness: 0.02,
          clearcoat: 0.1,
        });

        const borderSize1 = SQUARE_SIZE * 8 + 1.2;
        const borderGeo1 = new RoundedBoxGeometry(
          borderSize1,
          0.3,
          borderSize1,
          5,
          0.1,
        );
        const border1 = new THREE.Mesh(borderGeo1, baseMat);
        border1.position.set(0, -0.4, 0);
        border1.receiveShadow = true;
        border1.castShadow = true;
        boardGroup.add(border1);

        const borderSize2 = SQUARE_SIZE * 8 + 2.4;
        const borderGeo2 = new RoundedBoxGeometry(
          borderSize2,
          0.4,
          borderSize2,
          5,
          0.15,
        );
        const border2 = new THREE.Mesh(borderGeo2, baseMat);
        border2.position.set(0, -0.7, 0);
        border2.receiveShadow = true;
        border2.castShadow = true;
        boardGroup.add(border2);

        const accentGeo = new RoundedBoxGeometry(
          borderSize1 + 0.15,
          0.12,
          borderSize1 + 0.15,
          3,
          0.05,
        );
        const accentMat = new THREE.MeshPhysicalMaterial({
          color: COLOR_ACCENT,
          roughness: 0.1,
          metalness: 1.0,
          clearcoat: 0.5,
        });
        const accent = new THREE.Mesh(accentGeo, accentMat);
        accent.position.set(0, -0.35, 0);
        accent.castShadow = true;
        accent.receiveShadow = true;
        boardGroup.add(accent);

        scene.add(boardGroup);
      }

      // --- GERADORES DE PEÇAS ---
      const SEGMENTS = 64;

      const pieceMaterials = {
        light: new THREE.MeshPhysicalMaterial({
          color: 0xfffcf0,
          roughness: 0.4,
          metalness: 0.0,
          clearcoat: 0.1,
          clearcoatRoughness: 0.3,
          transmission: 0.0,
        }),
        dark: new THREE.MeshPhysicalMaterial({
          color: 0x111111,
          roughness: 0.35,
          metalness: 0.02,
          clearcoat: 0.15,
          clearcoatRoughness: 0.2,
        }),
      };

      const feltMat = new THREE.MeshStandardMaterial({
        color: 0x081c0c,
        roughness: 1.0,
      });

      function createPieceBase(material) {
        const group = new THREE.Group();

        const feltGeo = new THREE.CylinderGeometry(0.81, 0.81, 0.06, 32);
        const felt = new THREE.Mesh(feltGeo, feltMat);
        felt.position.y = 0.03;
        felt.receiveShadow = true;
        group.add(felt);

        const geo = new THREE.CylinderGeometry(0.78, 0.9, 0.34, SEGMENTS);
        const mesh = new THREE.Mesh(geo, material);
        mesh.position.y = 0.23;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        group.add(mesh);

        return group;
      }

      function createPawn(colorMode) {
        const group = new THREE.Group();
        const mat = pieceMaterials[colorMode];

        const points = [];
        points.push(new THREE.Vector2(0, 0));
        points.push(new THREE.Vector2(0.8, 0));
        points.push(new THREE.Vector2(0.75, 0.2));
        points.push(new THREE.Vector2(0.7, 0.3));
        points.push(new THREE.Vector2(0.5, 0.5));
        points.push(new THREE.Vector2(0.35, 1.2));
        points.push(new THREE.Vector2(0.55, 1.4));
        points.push(new THREE.Vector2(0.55, 1.5));
        points.push(new THREE.Vector2(0.35, 1.6));
        points.push(new THREE.Vector2(0, 1.6));

        const latheGeo = new THREE.LatheGeometry(points, SEGMENTS);
        const body = new THREE.Mesh(latheGeo, mat);
        body.castShadow = true;
        body.receiveShadow = true;
        group.add(body);

        const headGeo = new THREE.SphereGeometry(0.5, SEGMENTS, 32);
        const head = new THREE.Mesh(headGeo, mat);
        head.position.y = 2.0;
        head.castShadow = true;
        head.receiveShadow = true;
        group.add(head);

        return group;
      }

      function createRook(colorMode) {
        const group = new THREE.Group();
        const mat = pieceMaterials[colorMode];

        const points = [];
        points.push(new THREE.Vector2(0, 0));
        points.push(new THREE.Vector2(0.9, 0));
        points.push(new THREE.Vector2(0.8, 0.4));
        points.push(new THREE.Vector2(0.65, 0.6));
        points.push(new THREE.Vector2(0.55, 1.8));
        points.push(new THREE.Vector2(0.75, 2.0));
        points.push(new THREE.Vector2(0.75, 2.2));
        points.push(new THREE.Vector2(0.6, 2.3));
        points.push(new THREE.Vector2(0.85, 2.45));
        points.push(new THREE.Vector2(0.85, 2.5));
        points.push(new THREE.Vector2(0.5, 2.5));
        points.push(new THREE.Vector2(0.5, 2.2));
        points.push(new THREE.Vector2(0, 2.2));

        const latheGeo = new THREE.LatheGeometry(points, SEGMENTS);
        const body = new THREE.Mesh(latheGeo, mat);
        body.castShadow = true;
        body.receiveShadow = true;
        group.add(body);

        const numTeeth = 6;
        const toothSpan = (Math.PI * 2) / numTeeth;
        const solidSpan = toothSpan * 0.65;

        const bevelSize = 0.015;
        const rOut = 0.85 - bevelSize;
        const rIn = 0.5 + bevelSize;

        const toothShape = new THREE.Shape();
        toothShape.absarc(0, 0, rOut, 0, solidSpan, false);
        toothShape.lineTo(Math.cos(solidSpan) * rIn, Math.sin(solidSpan) * rIn);
        toothShape.absarc(0, 0, rIn, solidSpan, 0, true);
        toothShape.lineTo(rOut, 0);

        const extrudeSettings = {
          depth: 0.35,
          bevelEnabled: true,
          bevelSegments: 6,
          steps: 1,
          bevelSize: bevelSize,
          bevelThickness: bevelSize,
        };

        const toothGeo = new THREE.ExtrudeGeometry(toothShape, extrudeSettings);
        toothGeo.rotateX(-Math.PI / 2);

        for (let i = 0; i < numTeeth; i++) {
          const tooth = new THREE.Mesh(toothGeo, mat);
          tooth.position.y = 2.5;
          tooth.rotation.y = i * toothSpan;
          tooth.castShadow = true;
          tooth.receiveShadow = true;
          group.add(tooth);
        }

        return group;
      }

      function createKnight(colorMode) {
        const group = new THREE.Group();
        const mat = pieceMaterials[colorMode];

        group.add(createPieceBase(mat));

        const pedestalGeo = new THREE.CylinderGeometry(
          0.55,
          0.7,
          0.4,
          SEGMENTS,
        );
        const pedestal = new THREE.Mesh(pedestalGeo, mat);
        pedestal.position.y = 0.6;
        pedestal.castShadow = true;
        pedestal.receiveShadow = true;
        group.add(pedestal);

        const shape = new THREE.Shape();
        shape.moveTo(-0.4, 0);
        shape.bezierCurveTo(-0.6, 0.6, -0.2, 1.3, 0.0, 1.6);
        shape.lineTo(-0.1, 1.95);
        shape.lineTo(0.15, 1.65);
        shape.quadraticCurveTo(0.35, 1.7, 0.55, 1.2);
        shape.lineTo(0.75, 0.7);
        shape.quadraticCurveTo(0.8, 0.5, 0.55, 0.5);
        shape.lineTo(0.25, 0.85);
        shape.quadraticCurveTo(0.45, 0.4, 0.45, 0);
        shape.lineTo(-0.4, 0);

        const extrudeSettings = {
          depth: 0.35,
          bevelEnabled: true,
          bevelSegments: 12,
          steps: 1,
          bevelSize: 0.08,
          bevelThickness: 0.12,
        };

        const horseGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        horseGeo.computeBoundingBox();
        const centerOffset =
          -0.5 * (horseGeo.boundingBox.max.z + horseGeo.boundingBox.min.z);
        horseGeo.translate(0, 0, centerOffset);

        const horse = new THREE.Mesh(horseGeo, mat);
        horse.position.y = 0.8;
        horse.scale.set(1.2, 1.2, 1.2);
        horse.rotation.y = -Math.PI / 2;

        horse.castShadow = true;
        horse.receiveShadow = true;
        group.add(horse);

        const eyeGeo = new THREE.SphereGeometry(0.06, 16, 16);
        const eyeMat = new THREE.MeshPhysicalMaterial({
          color: 0x050505,
          roughness: 0.1,
          clearcoat: 0.5,
        });

        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.35, 1.35, 0.28);
        horse.add(rightEye);

        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(0.35, 1.35, -0.28);
        horse.add(leftEye);

        return group;
      }

      function createBishop(colorMode) {
        const group = new THREE.Group();
        const mat = pieceMaterials[colorMode];

        const points = [];
        points.push(new THREE.Vector2(0, 0));
        points.push(new THREE.Vector2(0.85, 0));
        points.push(new THREE.Vector2(0.8, 0.2));
        points.push(new THREE.Vector2(0.75, 0.4));
        points.push(new THREE.Vector2(0.55, 0.6));
        points.push(new THREE.Vector2(0.4, 1.8));
        points.push(new THREE.Vector2(0.65, 2.1));
        points.push(new THREE.Vector2(0.5, 2.3));
        points.push(new THREE.Vector2(0.6, 2.4));
        points.push(new THREE.Vector2(0.65, 2.6));
        points.push(new THREE.Vector2(0.45, 3.1));
        points.push(new THREE.Vector2(0.15, 3.4));
        points.push(new THREE.Vector2(0, 3.4));

        const latheGeo = new THREE.LatheGeometry(points, SEGMENTS);
        const body = new THREE.Mesh(latheGeo, mat);
        body.castShadow = true;
        body.receiveShadow = true;
        group.add(body);

        const topGeo = new THREE.SphereGeometry(0.15, 32, 16);
        const top = new THREE.Mesh(topGeo, mat);
        top.position.y = 3.5;
        top.castShadow = true;
        top.receiveShadow = true;
        group.add(top);

        return group;
      }

      function createQueen(colorMode) {
        const group = new THREE.Group();
        const mat = pieceMaterials[colorMode];

        const points = [];
        points.push(new THREE.Vector2(0, 0));
        points.push(new THREE.Vector2(0.9, 0));
        points.push(new THREE.Vector2(0.85, 0.2));
        points.push(new THREE.Vector2(0.75, 0.4));
        points.push(new THREE.Vector2(0.6, 0.6));
        points.push(new THREE.Vector2(0.45, 0.9));
        points.push(new THREE.Vector2(0.4, 2.0));
        points.push(new THREE.Vector2(0.45, 2.5));
        points.push(new THREE.Vector2(0.75, 2.7));
        points.push(new THREE.Vector2(0.55, 2.9));
        points.push(new THREE.Vector2(0.45, 3.0));
        points.push(new THREE.Vector2(0.85, 3.5));
        points.push(new THREE.Vector2(0.75, 3.6));
        points.push(new THREE.Vector2(0.35, 3.2));
        points.push(new THREE.Vector2(0, 3.2));

        const latheGeo = new THREE.LatheGeometry(points, SEGMENTS);
        const body = new THREE.Mesh(latheGeo, mat);
        body.castShadow = true;
        body.receiveShadow = true;
        group.add(body);

        const centerSphereGeo = new THREE.SphereGeometry(0.25, 32, 16);
        const centerSphere = new THREE.Mesh(centerSphereGeo, mat);
        centerSphere.position.y = 3.45;
        centerSphere.castShadow = true;
        centerSphere.receiveShadow = true;
        group.add(centerSphere);

        return group;
      }

      function createKing(colorMode) {
        const group = new THREE.Group();
        const mat = pieceMaterials[colorMode];

        const points = [];
        points.push(new THREE.Vector2(0, 0));
        points.push(new THREE.Vector2(0.9, 0));
        points.push(new THREE.Vector2(0.85, 0.2));
        points.push(new THREE.Vector2(0.8, 0.4));
        points.push(new THREE.Vector2(0.65, 0.6));
        points.push(new THREE.Vector2(0.55, 0.8));
        points.push(new THREE.Vector2(0.45, 2.2));
        points.push(new THREE.Vector2(0.7, 2.8));
        points.push(new THREE.Vector2(0.55, 3.0));
        points.push(new THREE.Vector2(0.85, 3.2));
        points.push(new THREE.Vector2(0.85, 3.3));
        points.push(new THREE.Vector2(0.75, 3.6));
        points.push(new THREE.Vector2(0.5, 3.9));
        points.push(new THREE.Vector2(0.2, 4.0));
        points.push(new THREE.Vector2(0, 4.0));

        const latheGeo = new THREE.LatheGeometry(points, SEGMENTS);
        const body = new THREE.Mesh(latheGeo, mat);
        body.castShadow = true;
        body.receiveShadow = true;
        group.add(body);

        const crossMat = mat;
        const crossVGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
        const crossV = new THREE.Mesh(crossVGeo, crossMat);
        crossV.position.y = 4.35;
        crossV.castShadow = true;
        crossV.receiveShadow = true;
        group.add(crossV);

        const crossHGeo = new THREE.BoxGeometry(0.6, 0.2, 0.2);
        const crossH = new THREE.Mesh(crossHGeo, crossMat);
        crossH.position.y = 4.45;
        crossH.castShadow = true;
        crossH.receiveShadow = true;
        group.add(crossH);

        return group;
      }

      function setupPieces() {
        const pieceLayout = [
          [
            "Rook",
            "Knight",
            "Bishop",
            "Queen",
            "King",
            "Bishop",
            "Knight",
            "Rook",
          ],
          ["Pawn", "Pawn", "Pawn", "Pawn", "Pawn", "Pawn", "Pawn", "Pawn"],
        ];

        const placePiece = (type, x, z, colorMode) => {
          let piece;
          switch (type) {
            case "Pawn":
              piece = createPawn(colorMode);
              break;
            case "Rook":
              piece = createRook(colorMode);
              break;
            case "Knight":
              piece = createKnight(colorMode);
              break;
            case "Bishop":
              piece = createBishop(colorMode);
              break;
            case "Queen":
              piece = createQueen(colorMode);
              break;
            case "King":
              piece = createKing(colorMode);
              break;
          }

          if (piece) {
            piece.position.set(
              x * SQUARE_SIZE - BOARD_OFFSET,
              0,
              z * SQUARE_SIZE - BOARD_OFFSET,
            );

            if (type === "Knight") {
              piece.rotation.y = colorMode === "dark" ? 0 : Math.PI;
            }

            scene.add(piece);
          }
        };

        for (let x = 0; x < 8; x++) {
          placePiece(pieceLayout[0][x], x, 0, "dark");
          placePiece(pieceLayout[1][x], x, 1, "dark");
        }

        for (let x = 0; x < 8; x++) {
          placePiece(pieceLayout[0][x], x, 7, "light");
          placePiece(pieceLayout[1][x], x, 6, "light");
        }
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);

        if (!isUserInteracting) {
          const time = Date.now() * 0.0001;
          camera.position.x = Math.sin(time) * 35;
          camera.position.z = Math.cos(time) * 35;
          camera.lookAt(0, 0, 0);
        }

        controls.update();
        renderer.render(scene, camera);
      }

      init();
      animate();
    </script>
  </body>
</html>
